plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.findProperty("mod_version") ?: "1.0.0"
group = project.findProperty("maven_group") ?: "antileak"

repositories {
	flatDir {
		dirs 'libs'
	}
	mavenCentral()
	maven { url "https://maven.meteordev.org/releases" }
	maven { url "https://maven.meteordev.org" }
	maven { url "https://jitpack.io" }
	maven { url "https://api.modrinth.com/maven" }
}

loom {
	accessWidenerPath = file("src/main/resources/reform.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "maven.modrinth:sodium:mc1.21.4-0.6.13-fabric"
	include "maven.modrinth:sodium:mc1.21.4-0.6.13-fabric"

	modImplementation "maven.modrinth:in-game-account-switcher:9.0.7+1.21.4-fabric"
	include "maven.modrinth:in-game-account-switcher:9.0.7+1.21.4-fabric"

// fast-items removed due to race conditions in Fabric 1.21.4 model loading

	modImplementation "maven.modrinth:midnightlib:1.7.3+1.21.4-fabric"
	include "maven.modrinth:midnightlib:1.7.3+1.21.4-fabric"

	modImplementation "maven.modrinth:appleskin:3.0.6+mc1.21.3"
	include "maven.modrinth:appleskin:3.0.6+mc1.21.3"

	implementation "meteordevelopment:orbit:0.2.3"
	include "meteordevelopment:orbit:0.2.3"

	implementation "com.badlogicgames.gdx:gdx:1.12.1"
	include "com.badlogicgames.gdx:gdx:1.12.1"

	implementation group: "local", name: "mediatransport4j", version: "1.0.2"
	include group: "local", name: "mediatransport4j", version: "1.0.2"

	implementation "dev.redstones.mediaplayerinfo:media-player-info:0.1.0"
	include "dev.redstones.mediaplayerinfo:media-player-info:0.1.0"

	compileOnly "org.projectlombok:lombok:${project.lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

sourceSets {
	main {
		java {
			exclude 'client/**'
			exclude 'itz/**'
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

