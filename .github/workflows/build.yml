name: Build OptomVisuals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: OptomVisuals-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
